plugins {
    id("io.micronaut.build.internal.discovery-client-module")
}

dependencies {
    annotationProcessor(mn.micronaut.graal)
    annotationProcessor(mnValidation.micronaut.validation.processor)
    annotationProcessor(mnSerde.micronaut.serde.processor)

    api(mn.micronaut.discovery.core)
    api(mn.micronaut.json.core)
    api(mn.micronaut.http.client.core)
    api(mnValidation.micronaut.validation)

    implementation(mnReactor.micronaut.reactor)
    implementation(mn.micronaut.retry)
    compileOnly(mn.micronaut.jackson.databind)
    compileOnly(mnSerde.micronaut.serde.jackson)
    compileOnly(mn.micronaut.management)

    testAnnotationProcessor(mn.micronaut.inject.java)
    testImplementation(mn.micronaut.http.client)
    testImplementation(mnTest.micronaut.test.spock)
    testImplementation(mn.micronaut.jackson.databind)

    testImplementation(mn.micronaut.management)
    testImplementation(mn.micronaut.http.server.netty)
    testImplementation(mn.snakeyaml)
    testImplementation(mnLogging.logback.classic)

    testCompileOnly(mn.micronaut.inject.groovy)
    testImplementation(platform(mnTest.boms.testcontainers))
    testImplementation(libs.testcontainers.vault)
}

spotless {
    java {
        targetExclude '**/io/micronaut/discovery/eureka/client/v2/AmazonInfo.java',
                '**/io/micronaut/discovery/eureka/client/v2/DataCenterInfo.java',
                '**/io/micronaut/discovery/eureka/client/v2/LeaseInfo.java'
    }
}

// The re-registration specs under src/testShared run in the test task with the default HTTP client and
// in the reactorClientTest task with the Micronaut Reactor HTTP client, whose result transformer turns
// 404 responses into empty publishers.
sourceSets {
    test {
        groovy.srcDir("src/testShared/groovy")
    }
    reactorClientTest {
        resources.srcDir("src/test/resources")
        groovy.srcDir("src/testShared/groovy")
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    reactorClientTestImplementation.extendsFrom(testImplementation)
    reactorClientTestCompileOnly.extendsFrom(testCompileOnly)
    reactorClientTestRuntimeOnly.extendsFrom(testRuntimeOnly)
}

dependencies {
    reactorClientTestImplementation(mnReactor.micronaut.reactor.http.client)
}

def reactorClientTest = tasks.register("reactorClientTest", Test) {
    description = "Runs the re-registration specs with the Micronaut Reactor HTTP client."
    group = "verification"
    testClassesDirs = sourceSets.reactorClientTest.output.classesDirs
    classpath = sourceSets.reactorClientTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter(tasks.named("test"))
}

tasks.named("check") {
    dependsOn(reactorClientTest)
}
