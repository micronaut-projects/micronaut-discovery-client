pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id("io.micronaut.build.shared.settings") version "8.1.4"
}

rootProject.name = 'discovery-client-parent'

include 'discovery-client-bom'
include 'discovery-client'
include 'discovery-client-tests'
include 'test-suite-spring-cloud-config-server'
include 'test-suite-consul-graal'
include 'test-suite-consul-graal-serde'
include 'test-suite-consul-graal-jacksondatabind'
include 'test-suite-consul-watch'
include 'test-suite-consul-utils'
include 'test-suite-eureka'
include 'test-suite-eureka-serde'
include 'test-suite-eureka-jacksondatabind'
include 'test-suite-docs-java'
include 'test-suite-docs-kotlin'
include 'test-suite-docs-groovy'
include 'test-suite-docs-python'

enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

micronautBuild {
    useStandardizedProjectNames = true
    importMicronautCatalog()
    importMicronautCatalog("micronaut-serde")
    importMicronautCatalog("micronaut-reactor")
    importMicronautCatalog("micronaut-validation")
}

// Micronaut Core 5.3.0-SNAPSHOT comes from the Central snapshots repository. Only io.micronaut
// snapshots are resolved from it. Projects declare their own repositories, which replace the
// settings ones, so it is added to each project too. To build against a core checkout instead,
// pass --include-build <path-to-micronaut-core>. Remove once the build moves to a core release.
def micronautSnapshotRepositories = { RepositoryHandler repositories ->
    repositories.maven {
        url = "https://central.sonatype.com/repository/maven-snapshots/"
        mavenContent {
            snapshotsOnly()
        }
        content {
            includeGroupByRegex("io\\.micronaut(\\..*)?")
        }
    }
}
dependencyResolutionManagement {
    micronautSnapshotRepositories(repositories)
    repositories {
        mavenCentral()
    }
}
gradle.beforeProject {
    micronautSnapshotRepositories(it.repositories)
}
