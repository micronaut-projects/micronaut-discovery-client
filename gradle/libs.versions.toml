[versions]
# Micronaut
micronaut = "4.9.1"
micronaut-platform = "4.5.1"
micronaut-docs = "2.0.0"
micronaut-test = "4.7.0"
micronaut-serde = "2.14.1"
micronaut-reactor = "3.7.0"
micronaut-test-resources="2.7.3"
micronaut-validation = "4.9.0"
micronaut-logging = "1.4.0"

commons-lang3 = "3.17.0"
jsonassert = "1.5.3"

groovy = "4.0.17"
spock = "2.3-groovy-4.0"
awaitility = "4.3.0"
sonatype-scan = "3.0.0"

[libraries]
# Core
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }

# Micronaut
micronaut-reactor = { module = "io.micronaut.reactor:micronaut-reactor-bom", version.ref = "micronaut-reactor" }
micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }
micronaut-test = { module = "io.micronaut.test:micronaut-test-bom", version.ref = "micronaut-test" }
micronaut-test-resources = { module = "io.micronaut.testresources:micronaut-test-resources-bom", version.ref = "micronaut-test-resources" }
micronaut-validation = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation" }

micronaut-docs-asciidoc-config-props = { module = "io.micronaut.docs:micronaut-docs-asciidoc-config-props", version.ref = "micronaut-docs" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
jsonassert = { module = "org.skyscreamer:jsonassert", version.ref = "jsonassert"}

spock = { module = 'org.spockframework:spock-core', version.ref = "spock" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter"}
testcontainers-consul = { module = "org.testcontainers:consul" }

junit-jupiter-engine = { module = 'org.junit.jupiter:junit-jupiter-engine' }
junit-platform-engine = { module = "org.junit.platform:junit-platform-suite-engine" }
sonatype-scan = { module = "org.sonatype.gradle.plugins:scan-gradle-plugin", version.ref = "sonatype-scan" }
