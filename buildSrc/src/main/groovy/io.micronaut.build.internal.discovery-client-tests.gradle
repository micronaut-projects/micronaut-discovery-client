plugins {
    id("io.micronaut.build.internal.discovery-client-base")
    id "io.micronaut.build.internal.common"
}

configurations.all {
    resolutionStrategy.preferProjectModules()
}

// The test suites keep their tests in their main sources, which Sonar would otherwise analyse as production code.
// Their coverage of the library is still reported through the aggregated JaCoCo report.
def sonarExtension = extensions.findByName("sonar")
if (sonarExtension != null) {
    sonarExtension.skipProject = true
}
